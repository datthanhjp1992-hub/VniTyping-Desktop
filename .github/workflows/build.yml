name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tạo bản phát hành với tag này (ví dụ v1.0.1). Để trống nếu chỉ build.'
        required: false
        default: ''

permissions:
  contents: write   # để đưa exe lên trang Releases khi tạo tag v*

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Cùng một script với khi build trên máy: test engine trước, rồi build exe
      - name: Test và build
        shell: cmd
        run: build.bat

      - name: Tải exe về từ tab Actions
        uses: actions/upload-artifact@v4
        with:
          name: VniTyping
          path: dist/VniTyping.exe
          if-no-files-found: error

      # Phát hành khi push tag v*, hoặc khi chạy tay (Run workflow) có nhập release_tag.
      # Với cách chạy tay, tag được tạo ngay trên GitHub tại commit vừa build.
      - name: Đưa exe lên Releases
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: VniTyping ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: CHANGELOG.md
          files: dist/VniTyping.exe
